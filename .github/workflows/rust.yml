name: Rust CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: creamy_cream_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/creamy_cream_test
      TEST_MINIO_ENDPOINT: http://127.0.0.1:9000
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Start isolated test MinIO
        run: |
          docker run -d --name creamy-minio-ci -p 9000:9000 \
            -e MINIO_ROOT_USER=test-access-key \
            -e MINIO_ROOT_PASSWORD=test-secret-key \
            quay.io/minio/minio server /data
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:9000/minio/health/live; then
              exit 0
            fi
            sleep 1
          done
          docker logs creamy-minio-ci
          exit 1
      - name: Tests
        run: cargo test --all-targets --locked
